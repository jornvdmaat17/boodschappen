services:
  postgres:
    image: postgres:15-alpine
    container_name: boodschappen-db
    environment:
      TZ: Europe/Amsterdam
      POSTGRES_USER: boodschappen
      POSTGRES_PASSWORD: ${DB_PASSWORD:-boodschappen}
      POSTGRES_DB: boodschappen
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boodschappen"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: boodschappen-backend
    environment:
      TZ: Europe/Amsterdam
      DATABASE_URL: postgres://boodschappen:${DB_PASSWORD:-boodschappen}@postgres:5432/boodschappen
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-jorn.vandermaat@blueprintautomation.nl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-boodschappen}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8085}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_AI_TOKEN: ${CLOUDFLARE_AI_TOKEN:-}
      CF_AI_MODEL: ${CF_AI_MODEL:-@cf/meta/llama-3.3-70b-instruct-fp8-fast}
      NODE_ENV: production
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: boodschappen-frontend
    ports:
      - "8085:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

  # Cloudflare Tunnel — only starts with: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: boodschappen-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - frontend
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
